<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worktree</title>
  <style>
    :root {
      /* Every color falls back to the original palette outside VS Code and is overridden
         by the --vscode-* variables the host forwards (see the message listener below). */
      --accent: var(--vscode-button-background, #bfff5a);
      --accent-fg: var(--vscode-button-foreground, #0a0d16);
      --accent-hover: var(--vscode-button-hoverBackground, #bfff5a);
      --bg: var(--vscode-sideBar-background, var(--vscode-editor-background, #fcfcfd));
      --surface: var(--vscode-editor-background, #fcfcfd);
      --input-bg: var(--vscode-input-background, #fff);
      --fg: var(--vscode-foreground, #151720);
      --fg-strong: var(--vscode-foreground, #0a0d16);
      --fg-muted: var(--vscode-descriptionForeground, #6b6d72);
      --border: var(--vscode-panel-border, var(--vscode-widget-border, #d5d9e8));
      --badge-bg: var(--vscode-badge-background, #ebeef7);
      --badge-fg: var(--vscode-badge-foreground, #474950);
      --focus: var(--vscode-focusBorder, #1a67fd);
      --hover-bg: var(--vscode-list-hoverBackground, #ebeef7);
      --menu-bg: var(--vscode-menu-background, var(--vscode-editorWidget-background, #fff));
      --menu-hover: var(--vscode-menu-selectionBackground, #bfff5a);
      --menu-hover-fg: var(--vscode-menu-selectionForeground, #0a0d16);
      --error: var(--vscode-errorForeground, #b42318);
      --font-sans: var(--vscode-font-family, "IBM Plex Sans", Inter, system-ui, sans-serif);
      --font-mono: var(--vscode-editor-font-family, "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: var(--font-sans);
      font-size: var(--vscode-font-size, 13px);
      color: var(--fg);
      background-color: var(--bg);
    }
    .eyebrow {
      margin: 0 0 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.021em;
      color: var(--fg-strong);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 { margin: 0; }
    button {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 56px;
      background: transparent;
      color: var(--fg-strong);
      font: 600 13px var(--font-sans);
      white-space: nowrap;
      cursor: pointer;
    }
    button:hover { background: var(--hover-bg); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: progress; }
    button:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
    button.icon { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; }
    .ico {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actions { display: flex; gap: 8px; }
    form.card { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    form[hidden], #main-view[hidden] { display: none; }
    form h2 { margin: 0; font-size: 16px; color: var(--fg-strong); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--fg-strong); }
    label small { font-weight: 400; color: var(--fg-muted); }
    input {
      padding: 6px 10px;
      border: 1px solid var(--vscode-input-border, var(--border));
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--vscode-input-foreground, var(--fg));
      font: 13px var(--font-mono);
    }
    #search { width: 100%; box-sizing: border-box; margin: 4px 0 8px; font-family: var(--font-sans); }
    select {
      padding: 6px 10px;
      border: 1px solid var(--vscode-input-border, var(--border));
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--vscode-input-foreground, var(--fg));
      font: 13px var(--font-mono);
    }
    input:focus, select:focus { outline: 1px solid var(--focus); outline-offset: -1px; }
    .list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .card {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      font-size: 14px;
      line-height: 1.5;
    }
    .branch {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--fg-strong);
      word-break: break-all;
    }
    .path {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-muted);
      word-break: break-all;
    }
    .path-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .copy {
      flex: none;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
    }
    .copy .ico { width: 14px; height: 14px; }
    .copy:hover, .copy:focus-visible { background: var(--hover-bg); color: var(--fg-strong); }
    .copy.copied, .copy.copied:hover { color: var(--vscode-testing-iconPassed, #388a34); }
    .badge {
      padding: 0 8px;
      border-radius: 56px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-size: 12px;
      font-weight: 500;
    }
    .badge.current { background: var(--fg-strong); color: var(--bg, #fff); }
    .worktree.is-current { border-color: var(--focus); }
    .badge.merged { background: transparent; color: var(--vscode-testing-iconPassed, #388a34); padding: 0 2px; display: inline-flex; align-items: center; }
    .badge.merged { position: relative; }
    .badge.merged::after {
      content: attr(data-tip);
      position: absolute; left: 0; bottom: calc(100% + 6px);
      padding: 4px 8px; border-radius: 6px; white-space: nowrap;
      background: var(--vscode-editorHoverWidget-background, #1f2328);
      color: var(--vscode-editorHoverWidget-foreground, #fff);
      border: 1px solid var(--vscode-editorHoverWidget-border, transparent);
      font-size: 12px; font-weight: 400; pointer-events: none;
      opacity: 0; transition: opacity 0.1s; z-index: 5;
    }
    .badge.merged:hover::after, .badge.merged:focus-visible::after { opacity: 1; }
    .badge.merged svg { width: 16px; height: 16px; }
    .badge.main { background: var(--accent); color: var(--accent-fg); }
    .worktree { cursor: default; user-select: text; }
    .worktree:hover { background: var(--hover-bg); }
    .worktree:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
    .date { margin-top: 4px; font-size: 12px; color: var(--fg-muted); }
    .description { margin-top: 6px; }
    .description-text {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .description-text p {
      flex: 1;
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }
    .description .add {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border: 0;
      border-radius: 4px;
      color: var(--fg-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .description .add .ico { width: 14px; height: 14px; }
    .description .edit { margin-top: 0; }
    .description .add:hover, .description .add:focus-visible { background: var(--hover-bg); color: var(--fg-strong); }
    textarea {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 6px 10px;
      border: 1px solid var(--vscode-input-border, var(--border));
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--vscode-input-foreground, var(--fg));
      font: 13px var(--font-sans);
      resize: vertical;
      user-select: text;
    }
    textarea:focus { outline: 1px solid var(--focus); outline-offset: -1px; }
    .description small { display: block; margin-top: 2px; color: var(--fg-muted); font-size: 11px; }
    .menu {
      position: fixed;
      z-index: 10;
      min-width: 168px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--menu-bg);
      color: var(--vscode-menu-foreground, var(--fg));
      box-shadow: 0 8px 24px var(--vscode-widget-shadow, rgba(29, 33, 48, 0.12));
    }
    .menu[hidden] { display: none; }
    .menu button {
      display: block;
      width: 100%;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      text-align: left;
      font-weight: 500;
    }
    .menu button { display: flex; align-items: center; gap: 8px; }
    .menu button .hint { margin-left: auto; padding-left: 16px; color: var(--fg-muted); font-size: 11px; font-weight: 400; }
    .menu button:hover .hint, .menu button:focus-visible .hint { color: inherit; opacity: 0.8; }
    .menu button.on .ico { fill: currentColor; }
    .menu hr { height: 1px; margin: 4px 6px; border: 0; background: var(--border); }
    .menu hr[hidden] { display: none; }
    .menu button:hover, .menu button:focus-visible { background: var(--menu-hover); color: var(--menu-hover-fg); outline: none; }
    .menu button[hidden] { display: none; }
    .menu button .ico { width: 14px; height: 14px; flex: none; }
    .menu button.danger { color: var(--error); }
    .menu button.danger:hover, .menu button.danger:focus-visible { background: var(--error); color: #fff; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
    }
    .overlay[hidden] { display: none; }
    .dialog {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--menu-bg);
      color: var(--vscode-menu-foreground, var(--fg));
      box-shadow: 0 8px 24px var(--vscode-widget-shadow, rgba(29, 33, 48, 0.2));
    }
    .dialog h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; }
    .dialog h2 .ico { width: 16px; height: 16px; flex: none; }
    .dialog.warning h2 { color: var(--vscode-editorWarning-foreground, #bf8803); }
    .dialog p { margin: 0 0 8px; font-size: 13px; word-break: break-word; }
    .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .dialog button.danger { background: var(--error); border-color: var(--error); color: #fff; }
    label.check { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; }
    label.check input { margin: 0; accent-color: var(--accent); }
    label.check small { flex-basis: 100%; }
    /* Compact style: one dense row per worktree instead of a card. */
    .list.compact { gap: 0; }
    .row {
      padding: 4px 8px;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-left: 2px solid transparent;
      font-size: 13px;
      line-height: 1.4;
    }
    .row.is-current { border-left-color: var(--focus); }
    .row .branch { flex-wrap: nowrap; gap: 6px; }
    .row .branch .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: normal; }
    .row .badge { flex: none; padding: 0 6px; font-size: 11px; }
    .row .copy { margin-top: 0; }
    .copy.star.on .ico { fill: currentColor; color: var(--focus); }
    .row-meta { display: flex; align-items: baseline; gap: 8px; }
    .row-meta .path {
      flex: 1;
      min-width: 0;
      margin-top: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-meta .date { flex: none; margin-top: 0; font-size: 11px; white-space: nowrap; }
    .row .description { margin-top: 0; }
    .row .description:empty { display: none; }
    .row .description-text p {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .row .description textarea { margin-top: 2px; }
    #free-branches { margin-top: 16px; }
    #free-branches h2 { margin: 0 0 8px; font-size: 13px; color: var(--fg-strong); }
    .message { color: var(--fg-muted); font-size: 13px; }
    .message.error { color: var(--error); }
    .version { display: block; text-align: center; color: var(--fg-muted); font-size: 11px; }
    code { font-family: var(--font-mono); font-size: 12px; }
  </style>
</head>
<body>
  <p class="eyebrow">Git worktrees</p>
  <div class="header">
    <h1>Worktree</h1>
    <div class="actions">
      <button id="settings-toggle" type="button" class="icon" data-i18n-title="settings.title" data-i18n-aria-label="settings.title"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="create" type="button" class="primary" data-i18n="create"></button>
    </div>
  </div>
  <form id="settings" class="card" hidden>
    <h2 data-i18n="settings.title"></h2>
    <label><span data-i18n="settings.baseBranch.label"></span>
      <select name="baseBranch"></select>
      <small data-i18n-html="settings.baseBranch.hint"></small>
    </label>
    <label><span data-i18n="settings.dir.label"></span>
      <input name="worktreesDir" placeholder=".worktree" autocomplete="off">
      <small data-i18n-html="settings.dir.hint"></small>
    </label>
    <label class="check">
      <input type="checkbox" name="compact">
      <span data-i18n="settings.compact.label"></span>
      <small data-i18n="settings.compact.hint"></small>
    </label>
    <label class="check">
      <input type="checkbox" name="remoteBranches">
      <span data-i18n="settings.remoteBranches.label"></span>
      <small data-i18n="settings.remoteBranches.hint"></small>
    </label>
    <label><span data-i18n="settings.locale.label"></span>
      <select name="locale">
        <option value="auto" data-i18n="settings.locale.auto"></option>
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
      <small data-i18n-html="settings.locale.hint"></small>
    </label>
    <p id="settings-message" class="message" hidden></p>
    <div class="actions">
      <button type="button" id="settings-close" data-i18n="settings.back"></button>
    </div>
    <small id="settings-version" class="version" hidden></small>
  </form>
  <div id="main-view">
  <form id="create-form" class="card" hidden>
    <label><span data-i18n="form.branch.label"></span>
      <input name="branch" required data-i18n-placeholder="form.branch.placeholder" autocomplete="off">
      <small data-i18n="form.branch.hint"></small>
    </label>
    <label><span data-i18n="form.base.label"></span>
      <input name="base" placeholder="main" autocomplete="off">
      <small data-i18n-html="form.base.hint"></small>
    </label>
    <label><span data-i18n="form.path.label"></span>
      <input name="path" autocomplete="off">
      <small data-i18n-html="form.path.hint"></small>
    </label>
    <p id="form-message" class="message error" hidden></p>
    <div class="actions">
      <button type="submit" class="primary" data-i18n="form.submit"></button>
      <button type="button" id="cancel" data-i18n="form.cancel"></button>
    </div>
  </form>
  <input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.label" autocomplete="off" spellcheck="false">
  <p id="message" class="message" data-i18n="list.loading"></p>
  <p id="empty" class="message" hidden data-i18n="search.empty"></p>
  <ul id="list" class="list"></ul>
  <section id="free-branches" hidden>
    <h2 data-i18n="branches.title"></h2>
    <ul id="free-branches-list" class="list"></ul>
  </section>
  </div>
  <div id="menu" class="menu" role="menu" hidden>
    <button id="menu-create" type="button" role="menuitem" hidden></button>
    <button id="menu-open" type="button" role="menuitem"></button>
    <button id="menu-star" type="button" role="menuitem"></button>
    <hr role="separator">
    <button id="menu-copy-abs" type="button" role="menuitem"></button>
    <button id="menu-copy-rel" type="button" role="menuitem"></button>
    <button id="menu-copy-branch" type="button" role="menuitem"></button>
    <hr id="menu-sep" role="separator">
    <button id="menu-delete" type="button" role="menuitem" class="danger"></button>
  </div>
  <div id="confirm" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <p id="confirm-path"><code></code></p>
      <div class="actions">
        <button type="button" id="confirm-cancel" data-i18n="form.cancel"></button>
        <button type="button" id="confirm-ok" class="danger" data-i18n="delete"></button>
      </div>
    </div>
  </div>
  <script>
    // The VS Code webview that frames this page forwards its theme (see renderFrame in
    // src/extension.ts). Ignore anything that is not from the embedding window.
    addEventListener("message", (event) => {
      if (event.source !== parent || event.data?.type !== "vscode-theme") return;
      const root = document.documentElement;
      for (const [name, value] of Object.entries(event.data.vars ?? {})) {
        if (name.startsWith("--vscode-") && typeof value === "string") root.style.setProperty(name, value);
      }
      root.dataset.vscodeThemeKind = event.data.kind ?? "";
    });

    // The server injects the active locale (see the setting `worktree.locale`) into `window.__I18N__`.
    const I18N = window.__I18N__ ?? { locale: "es", messages: {} };
    const LOCALE = I18N.locale;
    function t(key, params) {
      return (I18N.messages[key] ?? key).replace(/\{(\w+)\}/g, (_, name) => String(params?.[name] ?? ""));
    }
    for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
    for (const node of document.querySelectorAll("[data-i18n-html]")) node.innerHTML = t(node.dataset.i18nHtml);
    for (const node of document.querySelectorAll("[data-i18n-title]")) node.title = t(node.dataset.i18nTitle);
    for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
    for (const node of document.querySelectorAll("[data-i18n-aria-label]")) node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));

    const list = document.getElementById("list");
    const message = document.getElementById("message");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    /** List style (cards or compact rows) and the last worktrees received, to redraw when the style changes. */
    let compactMode = false;
    let lastWorktrees = [];

    /** Fuse.js (fuzzy search) is loaded on demand; until it arrives, or if it fails, a plain substring match is used. */
    let Fuse;
    import("/vendor/fuse.basic.min.mjs")
      .then((module) => {
        Fuse = module.default;
        if (query) render(lastWorktrees);
      })
      .catch(() => {});

    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    let query = "";
    let lastFree = { local: [], remote: [] };

    /** Keeps the worktrees matching the search box, best match first; without a query, the list as is. */
    function filterWorktrees(worktrees) {
      const text = query.trim();
      if (!text) return worktrees;
      if (Fuse) {
        const fuse = new Fuse(worktrees, { keys: ["branch", "path", "description", "head"], threshold: 0.35, ignoreLocation: true });
        return fuse.search(text).map((result) => result.item);
      }
      const needle = text.toLowerCase();
      return worktrees.filter((w) => [w.branch, w.path, w.description, w.head].some((value) => value?.toLowerCase().includes(needle)));
    }

    /** Keeps the branch names matching the search box, best match first; without a query, the list as is. */
    function filterBranches(branches) {
      const text = query.trim();
      if (!text) return branches;
      if (Fuse) {
        const fuse = new Fuse(branches, { keys: ["name"], threshold: 0.35, ignoreLocation: true });
        return fuse.search(text).map((result) => result.item);
      }
      const needle = text.toLowerCase();
      return branches.filter((b) => b.name.toLowerCase().includes(needle));
    }

    search.addEventListener("input", () => {
      query = search.value;
      render(lastWorktrees);
      renderFreeBranches(lastFree.local, lastFree.remote);
    });
    search.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && search.value) {
        event.preventDefault();
        search.value = query = "";
        render(lastWorktrees);
        renderFreeBranches(lastFree.local, lastFree.remote);
      }
    });

    function render(all) {
      lastWorktrees = all;
      const worktrees = filterWorktrees(all);
      empty.hidden = worktrees.length > 0 || all.length === 0;
      list.classList.toggle("compact", compactMode);
      list.replaceChildren(
        ...worktrees.map((worktree) => {
          const item = el("li", compactMode ? "row worktree" : "card worktree");
          item.tabIndex = 0;
          item.classList.toggle("is-current", Boolean(worktree.current));
          item.title = t("item.open.hint");
          item.addEventListener("dblclick", () => openWorktree(worktree.path));
          item.addEventListener("keydown", (event) => {
            if (event.key === "Enter") openWorktree(worktree.path);
          });
          // Keyboard route to the menu: the Menu key or Shift+F10, anchored to the item.
          item.addEventListener("keydown", (event) => {
            if (event.target !== item || !(event.key === "ContextMenu" || (event.key === "F10" && event.shiftKey))) return;
            event.preventDefault();
            const box = item.getBoundingClientRect();
            showMenu(box.left + 16, box.top + 24, worktree);
          });
          item.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            showMenu(event.clientX, event.clientY, worktree);
          });
          const title = el("div", "branch");
          const name = worktree.branch ?? (worktree.bare ? "(bare)" : worktree.head?.slice(0, 7) ?? t("badge.noHead"));
          title.append(el("span", "name", name));
          if (!compactMode) title.append(starButton(worktree));
          if (worktree.current) title.append(el("span", "badge current", "current"));
          if (worktree.main) title.append(el("span", "badge main", t("badge.main")));
          if (worktree.merged) title.append(mergedBadge(worktree));
          if (worktree.detached) title.append(el("span", "badge", "detached"));
          if (worktree.locked !== undefined) title.append(el("span", "badge", "locked"));
          if (worktree.prunable !== undefined) title.append(el("span", "badge", "prunable"));
          const path = el("div", "path", tildify(worktree.path));
          const description = descriptionBlock(worktree, compactMode);
          let date;
          if (worktree.committedAt) {
            date = el("div", "date", relativeTime(worktree.committedAt, compactMode));
            // Hovering swaps the relative time for the full date and time.
            date.addEventListener("mouseenter", () => (date.textContent = fullDate(worktree.committedAt)));
            date.addEventListener("mouseleave", () => (date.textContent = relativeTime(worktree.committedAt, compactMode)));
          }
          if (compactMode) {
            const edit = iconButton("edit", worktree.description ? t("description.edit") : t("description.add"), description.startEdit);
            title.append(starButton(worktree), copyButton(worktree.path), edit);
            const meta = el("div", "row-meta");
            meta.append(path);
            if (date) meta.append(date);
            // The path is cut with an ellipsis, so keep the full path readable on hover.
            path.title = worktree.path;
            item.append(title, meta, description);
          } else {
            const row = el("div", "path-row");
            row.append(path, copyButton(worktree.path));
            item.append(title, row, description);
            if (date) item.append(date);
          }
          return item;
        }),
      );
    }

    const DESCRIPTION_MAX = 500;
    /** Latest snapshot received while a description was being edited; rendered afterwards. */
    let pendingRender;
    let editing = false;

    function showSnapshot(data) {
      projectDir = data.cwd ?? projectDir;
      if (editing) {
        pendingRender = data;
        return;
      }
      home = data.home ?? home;
      setCompactMode(data.compact === true);
      render(data.worktrees);
      renderFreeBranches(data.freeBranches ?? [], data.freeRemoteBranches ?? []);
    }

    /** Lists the local branches no worktree has checked out. */
    function renderFreeBranches(local, remote) {
      lastFree = { local, remote };
      const branches = filterBranches([...local.map((name) => ({ name })), ...remote.map((name) => ({ name, remote: true }))]);
      document.getElementById("free-branches").hidden = branches.length === 0;
      const list = document.getElementById("free-branches-list");
      list.classList.toggle("compact", compactMode);
      list.replaceChildren(
        ...branches.map(({ name, remote }) => {
          const item = el("li", compactMode ? "row" : "card");
          item.tabIndex = 0;
          item.title = t("branches.create.hint");
          item.addEventListener("dblclick", () => createWorktreeFor(name, remote));
          item.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            showBranchMenu(event.clientX, event.clientY, name, remote);
          });
          item.addEventListener("keydown", (event) => {
            if (event.key === "Enter") createWorktreeFor(name, remote);
            else if (event.target === item && (event.key === "ContextMenu" || (event.key === "F10" && event.shiftKey))) {
              event.preventDefault();
              const box = item.getBoundingClientRect();
              showBranchMenu(box.left + 16, box.top + 24, name, remote);
            }
          });
          item.append(el("div", "branch", ""));
          item.firstChild.append(el("span", "name", name));
          if (remote) item.firstChild.append(el("span", "badge", t("branches.remote")));
          return item;
        }),
      );
    }

    /** Switches between cards and rows; the settings checkbox follows, so other instances stay in sync. */
    function setCompactMode(value) {
      compactMode = value;
      document.querySelector("#settings [name=compact]").checked = value;
    }

    /**
     * Description of a worktree: text with an edit icon, or an "add" button when empty.
     * In compact rows only the text is shown (one line); the row's own edit button calls `startEdit`.
     */
    function descriptionBlock(worktree, compact) {
      const block = el("div", "description");
      for (const type of ["dblclick", "keydown", "contextmenu"]) block.addEventListener(type, (event) => event.stopPropagation());
      const show = () => {
        editing = false;
        if (pendingRender) {
          const data = pendingRender;
          pendingRender = undefined;
          showSnapshot(data);
          return;
        }
        block.replaceChildren(...view().children);
      };
      const edit = () => {
        editing = true;
        const area = el("textarea");
        area.value = worktree.description ?? "";
        area.maxLength = DESCRIPTION_MAX;
        area.placeholder = t("description.placeholder");
        area.setAttribute("aria-label", t("description.label"));
        const hint = el("small", "", t("description.hint", { shortcut: /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘+Enter" : "Alt+Enter" }));
        let cancelled = false;
        area.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            cancelled = true;
            area.blur();
          } else if (event.key === "Enter" && (event.altKey || event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            area.blur();
          }
        });
        area.addEventListener("blur", async () => {
          const value = area.value.trim();
          if (cancelled || value === (worktree.description ?? "")) return show();
          try {
            const response = await fetch("/api/worktrees/description", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: worktree.path, description: value }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);
            pendingRender = undefined;
            editing = false;
            showSnapshot(data);
            message.className = "message";
            message.textContent = t("description.saved");
          } catch (error) {
            message.className = "message error";
            message.textContent = error.message;
            show();
          }
        });
        block.replaceChildren(area, hint);
        area.focus();
      };
      const view = () => {
        const wrap = el("div");
        if (compact) {
          if (worktree.description) {
            const text = el("p", "", worktree.description);
            text.title = worktree.description;
            text.addEventListener("dblclick", edit);
            const row = el("div", "description-text");
            row.append(text);
            wrap.append(row);
          }
        } else if (worktree.description) {
          const text = el("div", "description-text");
          const edit_ = iconButton("edit", t("description.edit"), edit);
          edit_.classList.add("edit");
          const paragraph = el("p", "", worktree.description);
          paragraph.addEventListener("dblclick", edit);
          text.append(paragraph, edit_);
          wrap.append(text);
        } else {
          const add = el("button", "add");
          add.type = "button";
          add.innerHTML = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS.edit}</svg>`;
          add.append(t("description.add"));
          add.addEventListener("click", (event) => {
            event.stopPropagation();
            edit();
          });
          wrap.append(add);
        }
        return wrap;
      };
      block.append(...view().children);
      block.startEdit = edit;
      return block;
    }

    /** Check shown on worktrees whose branch is already merged into the main branch. */
    function mergedBadge(worktree) {
      const badge = el("span", "badge merged");
      const label = t("badge.merged", { branch: worktree.mergedInto ?? "" });
      badge.dataset.tip = label;
      badge.tabIndex = 0;
      badge.setAttribute("role", "img");
      badge.setAttribute("aria-label", label);
      badge.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.3l2.2 2.2L11 6"/></svg>';
      return badge;
    }

    /** Star toggle; the server answers with the reordered list, starred worktrees first. */
    async function toggleStar(worktree) {
      try {
        const response = await fetch("/api/worktrees/star", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: worktree.path, starred: !worktree.starred }),
        });
        const data = await response.json();
        if (response.ok) showSnapshot(data);
      } catch {
        // Keeping the current list is enough; the next refresh shows the real state.
      }
    }

    function starButton(worktree) {
      const label = worktree.starred ? t("star.remove") : t("star.mark");
      const button = iconButton("star", label, () => toggleStar(worktree));
      button.classList.add("star");
      button.classList.toggle("on", Boolean(worktree.starred));
      button.setAttribute("aria-pressed", String(Boolean(worktree.starred)));
      return button;
    }

    function iconButton(icon, label, onClick) {
      const button = el("button", "copy");
      setIcon(button, icon);
      button.type = "button";
      button.title = label;
      button.setAttribute("aria-label", label);
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        onClick();
      });
      return button;
    }

    const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: "auto" });
    const units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];

    /** Full local date and time with the time zone, shown while hovering the relative time. */
    function fullDate(seconds) {
      return new Date(seconds * 1000).toLocaleString(LOCALE, { dateStyle: "full", timeStyle: "long" });
    }

    /** `Último commit hace 2 horas`; compact rows drop the prefix (`hace 2 horas`). */
    function relativeTime(seconds, compact) {
      const wrap = (when) => (compact ? when : t("time.lastCommit", { when }));
      const diff = seconds - Date.now() / 1000;
      for (const [unit, size] of units) {
        if (Math.abs(diff) >= size) return wrap(rtf.format(Math.round(diff / size), unit));
      }
      return wrap(t("time.now"));
    }

    const ICONS = {
      copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      open: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
      warning: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    };

    /** Inline SVG icon; it draws with `currentColor`, so it follows the VS Code theme. */
    function setIcon(button, name) {
      button.innerHTML = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
    }

    /** Copies the real (absolute) path; the button swaps to a check icon briefly on success. */
    function copyButton(path) {
      const button = el("button", "copy");
      setIcon(button, "copy");
      button.type = "button";
      button.title = t("path.copy");
      button.setAttribute("aria-label", t("path.copy"));
      for (const type of ["dblclick", "keydown"]) button.addEventListener(type, (event) => event.stopPropagation());
      button.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (!(await copyText(path))) return;
        setIcon(button, "check");
        button.classList.add("copied");
        setTimeout(() => {
          setIcon(button, "copy");
          button.classList.remove("copied");
        }, 1200);
      });
      return button;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        return ok;
      }
    }

    let home = "";
    /** Folder open in VS Code; relative paths are computed from it. */
    let projectDir = "";

    /** `/repos/app` → `/repos/app/.worktree/x` gives `.worktree/x`; elsewhere `../app-x`; the same folder gives `.`. */
    function relativePath(from, to) {
      const split = (path) => path.replace(/\\/g, "/").split("/").filter(Boolean);
      const a = split(from);
      const b = split(to);
      let common = 0;
      while (common < a.length && common < b.length && a[common] === b[common]) common++;
      const parts = [...a.slice(common).map(() => ".."), ...b.slice(common)];
      return parts.join("/") || ".";
    }

    /** Display-only: shows `$HOME/` as `~/`; actions keep using the real path. */
    function tildify(path) {
      if (home && path === home) return "~";
      if (home && path.startsWith(home + "/")) return "~" + path.slice(home.length);
      return path;
    }

    async function openWorktree(path) {
      try {
        const response = await fetch("/api/worktrees/open", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        message.className = "message";
        message.textContent = t("open.opening", { path: tildify(data.path) });
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      }
    }

    /** Creates the worktree of an existing branch and opens it in the IDE. */
    async function createWorktreeFor(branch, remote) {
      // `origin/foo` becomes the local branch `foo`, created from the remote one.
      const base = remote ? branch : undefined;
      if (remote) branch = branch.slice(branch.indexOf("/") + 1);
      message.className = "message";
      message.textContent = t("branches.creating", { branch });
      try {
        const response = await fetch("/api/worktrees", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ branch, base }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        showSnapshot(data);
        await openWorktree(data.path);
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      }
    }

    const menu = document.getElementById("menu");
    const menuDelete = document.getElementById("menu-delete");
    const menuOpen = document.getElementById("menu-open");
    const menuSep = document.getElementById("menu-sep");
    setIcon(menuOpen, "open");
    menuOpen.append(t("menu.open"));
    menuOpen.append(el("span", "hint", "Enter"));
    const menuStar = document.getElementById("menu-star");
    menuStar.addEventListener("click", () => {
      hideMenu();
      toggleStar(menuWorktree);
    });
    for (const [id, label] of [["menu-copy-abs", t("path.copyAbsolute")], ["menu-copy-rel", t("path.copyRelative")]]) {
      const button = document.getElementById(id);
      setIcon(button, "copy");
      button.append(label);
      button.addEventListener("click", async () => {
        hideMenu();
        const text = id === "menu-copy-abs" ? menuPath : relativePath(projectDir, menuPath);
        const ok = await copyText(text);
        message.className = ok ? "message" : "message error";
        message.textContent = ok ? t("path.copied", { text }) : t("path.copyFailed");
      });
    }
    const menuCopyBranch = document.getElementById("menu-copy-branch");
    setIcon(menuCopyBranch, "copy");
    menuCopyBranch.append(t("branch.copy"));
    menuCopyBranch.addEventListener("click", async () => {
      hideMenu();
      const text = menuBranchName;
      const ok = await copyText(text);
      message.className = ok ? "message" : "message error";
      message.textContent = ok ? t("branch.copied", { text }) : t("branch.copyFailed");
    });
    setIcon(menuDelete, "trash");
    menuDelete.append(t("delete"));
    /** Element that had focus before the menu opened, to give it back on close. */
    let menuReturnFocus;
    let menuPath;
    let menuWorktree;
    let menuBranchName;

    const menuCreate = document.getElementById("menu-create");
    setIcon(menuCreate, "plus");
    menuCreate.append(t("create"));
    let menuBranch;
    menuCreate.addEventListener("click", () => {
      hideMenu();
      createWorktreeFor(menuBranch.name, menuBranch.remote);
    });

    /** Menu of a branch without worktree: its only entry creates the worktree. */
    function showBranchMenu(x, y, name, remote) {
      menuBranch = { name, remote };
      menuBranchName = name;
      for (const child of menu.children) child.hidden = child !== menuCreate && child !== menuCopyBranch;
      placeMenu(x, y);
    }

    function showMenu(x, y, worktree) {
      menuPath = worktree.path;
      menuWorktree = worktree;
      menuBranchName = worktree.branch;
      for (const child of menu.children) child.hidden = child === menuCreate;
      // A detached HEAD has no branch to copy.
      menuCopyBranch.hidden = !worktree.branch;
      // The main worktree (and the one open in VS Code) cannot be removed, so no button.
      menuDelete.hidden = menuSep.hidden = Boolean(worktree.main || worktree.current);
      setIcon(menuStar, "star");
      menuStar.classList.toggle("on", Boolean(worktree.starred));
      menuStar.append(worktree.starred ? t("star.remove") : t("star.add"));
      placeMenu(x, y);
    }

    function placeMenu(x, y) {
      menuReturnFocus = document.activeElement;
      menu.hidden = false;
      const { width, height } = menu.getBoundingClientRect();
      menu.style.left = `${Math.min(x, innerWidth - width - 4)}px`;
      menu.style.top = `${Math.min(y, innerHeight - height - 4)}px`;
      menuItems()[0].focus();
    }

    function hideMenu({ restoreFocus = false } = {}) {
      if (menu.hidden) return;
      menu.hidden = true;
      if (restoreFocus) menuReturnFocus?.focus?.();
    }

    function menuItems() {
      return [...menu.querySelectorAll("button")].filter((button) => !button.hidden);
    }

    // Arrow keys, Home and End move through the items; Tab closes, like a native menu.
    menu.addEventListener("keydown", (event) => {
      const items = menuItems();
      const index = items.indexOf(document.activeElement);
      const move = { ArrowDown: index + 1, ArrowUp: index - 1, Home: 0, End: items.length - 1 }[event.key];
      if (move !== undefined) {
        event.preventDefault();
        items[(move + items.length) % items.length].focus();
      } else if (event.key === "Tab" || event.key === "Escape") {
        event.preventDefault();
        hideMenu({ restoreFocus: true });
      }
      event.stopPropagation();
    });

    document.getElementById("menu-open").addEventListener("click", () => {
      hideMenu();
      openWorktree(menuPath);
    });
    menuDelete.addEventListener("click", () => {
      hideMenu();
      deleteWorktree(menuWorktree);
    });

    const confirmBox = document.getElementById("confirm");
    let confirmResolve;

    /** Modal confirmation (window.confirm is not available in the sandboxed webview); resolves true on accept. */
    function askConfirm({ title, text, path, ok, warning }) {
      const dialog = confirmBox.querySelector(".dialog");
      dialog.classList.toggle("warning", Boolean(warning));
      const heading = document.getElementById("confirm-title");
      setIcon(heading, warning ? "warning" : "trash");
      heading.append(title);
      document.getElementById("confirm-text").textContent = text;
      document.getElementById("confirm-path").firstElementChild.textContent = path;
      document.getElementById("confirm-ok").textContent = ok;
      confirmBox.hidden = false;
      document.getElementById("confirm-cancel").focus();
      return new Promise((resolve) => (confirmResolve = resolve));
    }

    function closeConfirm(result) {
      confirmBox.hidden = true;
      confirmResolve?.(result);
      confirmResolve = undefined;
    }

    document.getElementById("confirm-ok").addEventListener("click", () => closeConfirm(true));
    document.getElementById("confirm-cancel").addEventListener("click", () => closeConfirm(false));
    confirmBox.addEventListener("click", (event) => {
      if (event.target === confirmBox) closeConfirm(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !confirmBox.hidden) closeConfirm(false);
    });

    async function requestDelete(path, force) {
      const response = await fetch("/api/worktrees", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, force }),
      });
      return { response, data: await response.json() };
    }

    /** Removes a worktree; when it has uncommitted changes, warns and only removes after confirmation. */
    async function deleteWorktree(worktree) {
      try {
        let { response, data } = await requestDelete(worktree.path, false);
        if (response.status === 409 && data.dirty) {
          const accepted = await askConfirm({
            title: t("delete.dirty.title"),
            text: t("delete.dirty.text", { changes: data.changes }),
            path: tildify(worktree.path),
            ok: t("delete.anyway"),
            warning: true,
          });
          if (!accepted) return;
          ({ response, data } = await requestDelete(worktree.path, true));
        }
        if (!response.ok) throw new Error(data.error);
        home = data.home ?? home;
        showSnapshot(data);
        message.className = "message";
        message.textContent = t("delete.done", { path: tildify(worktree.path) });
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      }
    }

    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target)) hideMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideMenu({ restoreFocus: true });
    });
    addEventListener("blur", hideMenu);
    addEventListener("scroll", hideMenu, true);

    /** Live list: the server pushes a new snapshot whenever the worktrees change. */
    function listen() {
      const source = new EventSource("/api/worktrees/events");
      source.addEventListener("worktrees", (event) => {
        const data = JSON.parse(event.data);
        home = data.home ?? home;
        showSnapshot(data);
        message.className = "message";
        message.textContent = t("list.count", { count: data.worktrees.length, cwd: tildify(data.cwd) });
      });
      source.addEventListener("failure", (event) => {
        list.replaceChildren();
        message.className = "message error";
        message.textContent = JSON.parse(event.data).error;
      });
      source.addEventListener("error", () => {
        if (source.readyState === EventSource.CONNECTING) message.textContent = t("list.reconnecting");
      });
    }

    const form = document.getElementById("create-form");
    const formMessage = document.getElementById("form-message");

    function toggleForm(open) {
      form.hidden = !open;
      formMessage.hidden = true;
      if (open) form.elements.branch.focus();
      else form.reset();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = form.querySelector("button[type=submit]");
      submit.disabled = true;
      formMessage.hidden = true;
      try {
        const response = await fetch("/api/worktrees", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        toggleForm(false);
        showSnapshot(data);
        message.className = "message";
        message.textContent = t("form.created", { path: tildify(data.path) });
      } catch (error) {
        formMessage.textContent = error.message;
        formMessage.hidden = false;
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById("create").addEventListener("click", () => toggleForm(form.hidden));
    document.getElementById("cancel").addEventListener("click", () => toggleForm(false));

    const settings = document.getElementById("settings");
    const settingsMessage = document.getElementById("settings-message");
    const mainView = document.getElementById("main-view");

    const settingsState = { baseBranch: "", worktreesDir: ".worktree", compact: false };

    /** Same slug rule as the backend (`branchSlug`), so the placeholder matches the real path. */
    function slug(branch) {
      return branch.replace(/[^\w.-]+/g, "-").replace(/^-+|-+$/g, "");
    }

    /** Shows the configured defaults as placeholders and in the hints of the create form. */
    function updateFormDefaults() {
      const dir = settingsState.worktreesDir.replace(/\/+$/, "");
      const name = slug(form.elements.branch.value.trim()) || slug(t("form.branch.placeholder"));
      form.elements.base.placeholder = settingsState.baseBranch || "HEAD";
      form.elements.path.placeholder = `${dir}/${name}`;
      document.getElementById("base-default").textContent = settingsState.baseBranch || "HEAD";
      document.getElementById("path-default").textContent = `${dir}/${t("form.path.name")}`;
    }

    form.elements.branch.addEventListener("input", updateFormDefaults);

    function applySettings(data) {
      const names = data.branches.includes(data.baseBranch) || !data.baseBranch ? data.branches : [data.baseBranch, ...data.branches];
      const option = (value, text) => Object.assign(document.createElement("option"), { value, textContent: text });
      settings.elements.baseBranch.replaceChildren(option("", t("settings.baseBranch.default")), ...names.map((name) => option(name, name)));
      settings.elements.baseBranch.value = data.baseBranch;
      settings.elements.worktreesDir.value = data.worktreesDir;
      settingsState.baseBranch = data.baseBranch;
      settingsState.worktreesDir = data.worktreesDir;
      settingsState.compact = data.compact === true;
      settings.elements.compact.checked = settingsState.compact;
      settings.elements.remoteBranches.checked = data.remoteBranches !== false;
      settings.elements.locale.value = data.locale ?? "auto";
      const versionLabel = document.getElementById("settings-version");
      versionLabel.textContent = data.version ? t("settings.version", { version: data.version }) : "";
      versionLabel.hidden = !data.version;
      if (compactMode !== settingsState.compact) {
        compactMode = settingsState.compact;
        render(lastWorktrees);
      }
      updateFormDefaults();
    }

    function showSettingsMessage(text, error) {
      settingsMessage.textContent = text;
      settingsMessage.className = error ? "message error" : "message";
      settingsMessage.hidden = !text;
    }

    async function toggleSettings(open) {
      settings.hidden = !open;
      mainView.hidden = open;
      showSettingsMessage("", false);
      if (!open) return;
      try {
        const response = await fetch("/api/settings");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        applySettings(data);
        settings.elements.baseBranch.focus();
      } catch (error) {
        showSettingsMessage(error.message, true);
      }
    }

    // Saves as soon as the selection changes; there is no save button.
    settings.addEventListener("submit", (event) => event.preventDefault());
    async function saveSettings(field) {
      field.disabled = true;
      try {
        const response = await fetch("/api/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [field.name]: field.type === "checkbox" ? field.checked : field.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        applySettings(data);
        showSettingsMessage(t("settings.saved"), false);
        // The texts are injected when the page is served, so a new language needs a reload.
        if (field.name === "locale") location.reload();
      } catch (error) {
        showSettingsMessage(error.message, true);
      } finally {
        field.disabled = false;
      }
    }

    for (const name of ["baseBranch", "worktreesDir", "compact", "remoteBranches", "locale"]) {
      settings.elements[name].addEventListener("change", (event) => saveSettings(event.target));
    }

    document.getElementById("settings-toggle").addEventListener("click", () => toggleSettings(settings.hidden));
    document.getElementById("settings-close").addEventListener("click", () => toggleSettings(false));
    fetch("/api/settings").then((r) => (r.ok ? r.json() : undefined)).then((data) => data && applySettings(data), () => {});
    listen();

    /**
     * VS Code does not forward Ctrl/Cmd+C/X/V/A to a cross-origin iframe inside a webview,
     * so clipboard shortcuts do nothing. Handle them here with the Clipboard API.
     */
    document.addEventListener("keydown", async (event) => {
      if (!(event.ctrlKey || event.metaKey) || event.altKey || event.defaultPrevented) return;
      const key = event.key.toLowerCase();
      if (!["c", "x", "v", "a"].includes(key)) return;
      const el = document.activeElement;
      const editable = el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !["checkbox", "radio", "button", "submit"].includes(el.type)));
      try {
        if (key === "a") {
          if (editable) el.select();
          else getSelection().selectAllChildren(document.body);
          event.preventDefault();
        } else if (key === "c" || key === "x") {
          const text = editable ? el.value.slice(el.selectionStart, el.selectionEnd) : String(getSelection());
          if (!text) return;
          event.preventDefault();
          await navigator.clipboard.writeText(text);
          if (key === "x" && editable && !el.readOnly) {
            el.setRangeText("", el.selectionStart, el.selectionEnd, "end");
            el.dispatchEvent(new Event("input", { bubbles: true }));
          }
        } else if (editable && !el.readOnly) {
          event.preventDefault();
          const text = await navigator.clipboard.readText();
          el.setRangeText(text, el.selectionStart, el.selectionEnd, "end");
          el.dispatchEvent(new Event("input", { bubbles: true }));
        }
      } catch {
        // Clipboard permission denied: fall back to the browser's own behavior.
        document.execCommand(key === "v" ? "paste" : key === "x" ? "cut" : key === "c" ? "copy" : "selectAll");
      }
    });
  </script>
</body>
</html>
