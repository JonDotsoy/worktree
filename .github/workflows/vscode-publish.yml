name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag del GitHub Release a publicar (por ejemplo v0.0.18 o 0.0.18)
        type: string
        required: true
  workflow_call:
    inputs:
      release:
        description: Tag del GitHub Release a publicar (por ejemplo v0.0.18 o 0.0.18)
        type: string
        required: true

permissions:
  contents: write # añadir la nota al release
  id-token: write # OIDC para Trusted Publishing del Marketplace

concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release
        env:
          INPUT: ${{ inputs.release }}
        run: |
          tag="v${INPUT#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=worktree-${tag#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: Download VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --dir vsix

      - name: Publish to Marketplace (Trusted Publishing)
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
        run: bunx vsce publish --packagePath "vsix/$VSIX" --oidc

      - name: Add Marketplace note to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          package_url="https://marketplace.visualstudio.com/items?itemName=jondotsoy.worktree"
          version_url="$package_url&ssr=false#version-history"
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if grep -qF "$package_url" <<<"$body"; then
            echo "Release $TAG already has the Marketplace note"
            exit 0
          fi
          printf '%s\n\n---\n\nPublicado en el VS Code Marketplace: [versión %s](%s) · [paquete](%s)\n' \
            "$body" "${TAG#v}" "$version_url" "$package_url" > release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
