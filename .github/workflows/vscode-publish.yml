name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag del GitHub Release a publicar (por ejemplo v0.0.18 o 0.0.18)
        type: string
        required: true

permissions:
  contents: read
  id-token: write # OIDC hacia Microsoft Entra ID

concurrency:
  group: vscode-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release
        env:
          INPUT: ${{ inputs.release }}
        run: |
          tag="v${INPUT#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=worktree-${tag#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: Download VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VSIX: ${{ steps.release.outputs.vsix }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --dir vsix

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Marketplace
        env:
          VSIX: ${{ steps.release.outputs.vsix }}
        run: bunx vsce publish --packagePath "vsix/$VSIX" --azure-credential
