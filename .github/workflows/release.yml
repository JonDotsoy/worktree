name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          bun run typecheck
          bun test

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(npm version "$BUMP" --no-git-tag-version)"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=worktree-${version#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: bun run package --out "${{ steps.version.outputs.vsix }}"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes
